# AI Avatar Video Pipeline Configuration

video:
  width: 1080
  height: 1920
  fps: 30
  format: "mp4"
  duration_target: 60  # seconds

avatar:
  provider: "heygen"
  position: "bottom-center"  # where avatar appears on screen
  size_ratio: 0.35  # avatar takes 35% of screen width
  background: "transparent"

broll:
  provider: "runway"
  model: "gen4-turbo"
  clip_duration: 5  # seconds per b-roll clip
  resolution: "720p"
  aspect_ratio: "9:16"

tts:
  provider: "elevenlabs"
  model: "eleven_multilingual_v2"
  stability: 0.5
  similarity_boost: 0.75
  style: 0.5

script:
  provider: "anthropic"  # or "openai"
  max_tokens: 2000
  style: "engaging_short_form"  # punchy, hook-driven content

composition:
  avatar_overlay: true
  captions: true
  caption_style: "word-by-word"  # tiktok-style animated captions
  background_music: true
  music_volume: 0.15
  transitions: "crossfade"
  transition_duration: 0.5
